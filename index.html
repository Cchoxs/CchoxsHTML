<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Não Seja Visto!</title>
<style>
:root{--bg:#0d0d2b;--fg:#fff;--ac:#ffe45e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Courier New',monospace;color:var(--fg)}
#c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;background:var(--bg)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:#0d0d2bd9;padding:12px;box-sizing:border-box;overflow:auto}
.ov[hidden]{display:none}
h1{margin:0;font-size:34px;line-height:1;color:var(--ac);text-shadow:3px 3px 0 #7a3cff}
h2{margin:0;font-size:22px;color:var(--ac)}p{margin:0;opacity:.85;max-width:320px;font-size:14px}
button{font:bold 18px 'Courier New',monospace;color:#111;background:var(--ac);border:3px solid #fff;border-radius:0;padding:10px 22px;min-width:220px;box-shadow:4px 4px 0 #7a3cff}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #7a3cff}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:420px;width:100%}
#grid button{min-width:0;padding:0;height:44px;font-size:11px;box-shadow:none;border:3px solid #fff8;color:#000}
#grid button.sel{border-color:#fff;outline:3px solid var(--ac)}
#pa{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;min-width:0;padding:4px 10px;font-size:16px;display:none}
</style></head><body>
<canvas id="c"></canvas>
<button id="pa">☰</button>
<div class="ov" id="menu"><h1>NÃO SEJA<br>VISTO!</h1><p>Leve o alienzinho até a Área 51, abduzindo planetas sem ser visto. Toque na esquerda ou na direita da tela para mover.</p>
<button id="bp">JOGAR</button><button id="bc">CORES</button><button id="bi"></button></div>
<div class="ov" id="cols" hidden><h2>CORES  ★ <span id="co"></span></h2><div id="grid"></div><p id="cm">Toque numa cor para comprar ou usar</p><button id="bb">VOLTAR</button></div>
<div class="ov" id="win" hidden><h1>ÁREA 51<br>ALCANÇADA!</h1><p>Você abduziu os 51 planetas sem ser visto. 👽</p><button id="bw">MENU</button></div>
<script>
const W=240,H=420,cv=$('c'),g=cv.getContext('2d');cv.width=W;cv.height=H;
function $(i){return document.getElementById(i)}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}fit();addEventListener('resize',fit);
let SV={lvl:1,coins:0,own:[0],sel:0,inv:0};try{Object.assign(SV,JSON.parse(localStorage.getItem('nsv')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('nsv',JSON.stringify(SV))}catch(e){}};
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0),f(8),f(4)].map(v=>Math.round(v*255))}
const COL=[...Array(30)].map((_,i)=>i?hsl((i*47)%360,75,62):[255,255,255]);
const mul=a=>()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const SI=new Image(),DI=new Image();let sp,rdy=0;
function tint(){const c=document.createElement('canvas');c.width=SI.width;c.height=SI.height;const x=c.getContext('2d');x.drawImage(SI,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data,k=COL[SV.sel];
 for(let i=0;i<p.length;i+=4)if(p[i+3]&&p[i]>250&&p[i+1]>250&&p[i+2]>250){p[i]=k[0];p[i+1]=k[1];p[i+2]=k[2]}x.putImageData(d,0,0);sp=c}
DI.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAARCAYAAADdRIy+AAAAi0lEQVR4nL2T0Q3AIAhEwXQMZ3M4Z3MP+oWxyqFGU36Fd3eiRH+VlCRSkuzOhdtGKhA52nX5nAL6qg45Zj4BVQ6R7WomoDN9H1yKF907C6rSKiF3ujjP/bAUC4riWeABuAKaRrZqBkOx4Tv07olj5tZl2/v5KVaDJeZFXn7MPURF+0Rwy9DBpR+1XC+pJF3lTzobAQAAAABJRU5ErkJggg==';SI.onload=()=>{tint();rdy=1};SI.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAC8AAAAuCAYAAAC4e0AJAAACm0lEQVR4nOVZMZKDMAyUM/cBeMJRJWVS0ubZ115JSlLxBb6gKxhxipDANjJ3M9kqgEday2tZVgAc0fWIXY9offP05YauR0RErKpPrKrPxQToG+I0Oa+JfOw1gIhY1838PI4DhBACwDSp22X6DQDAxyEi0rjDwaPNI0rv+Tf+na8Qvc/lkDVzivY4DvB4Tu+u59fIarDGf30PwFeoGLp+GTl65pHWwMdIW8U39BrxFPAJyOdikBrnEU+dhGYnNfqn2IFd/5tVHs9JswCTjnMwjsOsebJBNmMRTZ47BZg2mySeM5HrGeZNXNdN0mEWTZ6iwqNOGMchi7gW/RQkR34Ldd2oKXMrjeYgijzXewy4tFKRovus8kDTu/yu/bbAdZ+C3bWNRG72yYG75o/E+5HnKc4DWvqNQRT52yWEo7ScsnHdN+wW5MVlD0zydEzTcpLTnOWNAdm/tw0gItIKrNX5KvmuR7y3r5rmOs/JyZoda9/EXhcX5DnxUjqXxR0FQ/qjUsOagLlhuSEyohn3Bq+NtoK3iLymaa1W8UqXspTQCFOpLPWflG3kakjnuciVp0l+q/g6soaxoO5ixGUJfCRZzbe2YdXIhxBC1yPy3sqeG08MrGA9nqASB9hoOvEVsDbtHliEY5tRpuaJOOVh3n+Up65GIIYsjac8z33c2wburZ5lCKuat7RG4CVEbNbhcgCwj39+WG62A2WDNLUJJButsgmV09rWOnQLG1r3a2/vkCbgZUfjdtKKMIBy1WMKrK4FcTtZF409laMXornJ5udex16y4bakvTlV0sH0Z3+1rIC4AaxfTtzgGflDIf+vKuXHfQmsK2QJObo2nay0S1c5T18A79gxs7DWnPoP50YU5JFeKuMUy5mccKnc/AMhoComMboDAQAAAABJRU5ErkJggg==';
const BG=[...Array(70)].map(()=>{const r=Math.random;return[r()*W|0,r()*H,.1+r()*.4,r()<.3?'#fff':'#6a6aa8']});
// estado
let st='menu',cam=0,camMax=0,t=0,tm=0,ship={x:W/2,vx:0,wy:0},ents=[],stars=[],planet,dir=0,seenT=0,run=0,al=0,ab=0,nt=0,L=0,spd=50;
const kk={};
function build(n){const r=Math.random,df=Math.min(1,n/51);L=620+n*14;const gap=Math.max(105,150-n*.9);ents=[];stars=[];al=0;tm=0;cam=0;run=0;let ls=r()<.5;
 for(let y=n<=4?260:330;n>1&&y<L-150;y+=gap*(.85+r()*.9)){const k=n==2?0:n==3?.5:n==4?.9:r();
  if(k<.45){ls=r()<.75?!ls:ls;ents.push({k:0,x:ls?0:W,y,base:ls?0:Math.PI,amp:.5+r()*.3,w:.7+r()*.5+df*.6,ph:r()*6,len:100+df*50,h:.14+df*.06})}
  else if(k<.8)ents.push({k:1,y,amp:70,sp:.6+r()*.6+df*.8,ph:r()*6,r:20+df*6});
  else ents.push({k:2,x:70+r()*100,y,r:22+df*8,ph:r()*6})}
 planet={x:45+r()*150,y:L,r:26,c:`hsl(${(n*37)%360},60%,55%)`,d:`hsl(${(n*37+30)%360},60%,40%)`};
 camMax=L-(H-90);spd=50+Math.min(30,n*.6);ship={x:W/2,vx:0,wy:70};st='play'}
function wrap(a){return Math.atan2(Math.sin(a),Math.cos(a))}
const SY=wy=>H-(wy-cam);
function seen(){const sx=ship.x,sy=ship.wy;for(const e of ents){if(!(tm>=e.t0+.7))continue;
 if(e.k==0){const a=e.base+e.amp*Math.sin(tm*e.w+e.ph),dx=sx-e.x,dy=sy-e.y,d=Math.hypot(dx,dy);if(d<e.len&&Math.abs(wrap(Math.atan2(dy,dx)-a))<e.h+5/Math.max(d,1))return 1}
 else if(e.k==1){if(Math.hypot(sx-(W/2+e.amp*Math.sin(tm*e.sp+e.ph)),sy-e.y)<e.r+5)return 1}
 else if((tm*.9+e.ph)%2<1.1&&Math.hypot(sx-e.x,sy-e.y)<e.r+5)return 1}return 0}
function update(dt){t+=dt;
 if(st=='play'){tm+=dt;for(const e of ents)if(e.t0===undefined&&e.y-ship.wy<340)e.t0=tm+Math.random()*.8;ship.vx+=(dir*120-ship.vx)*Math.min(1,dt*8);ship.x=Math.max(16,Math.min(W-16,ship.x+ship.vx*dt));
  cam=Math.min(cam+spd*dt,camMax);ship.wy=cam+100;
    if(seen()){st='seen';seenT=0;return}
  if(cam>=camMax&&Math.abs(ship.x-planet.x)<14){al+=dt;if(al>.5){st='abduct';ab=0}}else al=0}
 else if(st=='seen'){seenT+=dt;if(seenT>1.2)build(SV.lvl)}
 else if(st=='abduct'){ab+=dt;if(ab>1.3){SV.coins+=3;if(SV.lvl>=51){SV.lvl=1;save();st='win';$('win').hidden=0;$('pa').style.display='none'}else{SV.lvl++;save();st='next';nt=0}}}
 else if(st=='next'){nt+=dt;if(nt>1.1)build(SV.lvl)}}
function pl(x,y,r){g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();g.fillStyle=planet.c;g.fillRect(x-r,y-r,2*r,2*r);g.fillStyle=planet.d;for(let i=-r+6;i<r;i+=13)g.fillRect(x-r,y+i|0,2*r,4);g.fillStyle='rgba(255,255,255,.4)';g.fillRect(x-r*.5|0,y-r*.5|0,6,4);g.restore()}
function txt(s,x,y,c,sz,al){g.font='bold '+(sz||12)+'px monospace';g.textAlign=al||'left';g.fillStyle='#000';g.fillText(s,x+1,y+1);g.fillStyle=c||'#fff';g.fillText(s,x,y)}
const TT={1:'Alinhe a nave embaixo do planeta\npara abduzi-lo',2:'HOLOFOTE: gira e varre a tela.\nNão fique na luz!',3:'GUARDA: patrulha de lado a lado.\nFuja do círculo vermelho!',4:'OLHO: abre e fecha.\nPasse quando estiver fechado!'};
function draw(){g.imageSmoothingEnabled=false;g.fillStyle='#0d0d2b';g.fillRect(0,0,W,H);
 for(const s of BG){g.fillStyle=s[3];g.fillRect(s[0],(s[1]+cam*s[2])%H|0,2,2)}
 if(st=='menu'||st=='win'){g.drawImage(sp,W/2-sp.width/2|0,H/2-sp.height/2+Math.sin(t*3)*5|0);return}
 for(const e of ents){const y=SY(e.y);if(y<-200||y>H+200||e.t0===undefined)continue;const al=Math.max(0,Math.min(1,(tm-e.t0)/.7));if(al<=0)continue;g.globalAlpha=al<1?(Math.sin(tm*30)>0?.7:.3):1;
  if(e.k==0){const a=e.base+e.amp*Math.sin(tm*e.w+e.ph);g.fillStyle='rgba(255,240,120,.3)';g.beginPath();g.moveTo(e.x,y);
   for(let i=-4;i<=4;i++){const b=a+e.h*i/4;g.lineTo(e.x+Math.cos(b)*e.len,y-Math.sin(b)*e.len)}g.fill();
   g.fillStyle='#fff';g.beginPath();g.arc(e.x,y,8,0,7);g.fill();g.fillStyle='#000';g.fillRect(e.x+Math.cos(a)*3-2|0,y-Math.sin(a)*3-2|0,4,4)}
  else if(e.k==1){const x=W/2+e.amp*Math.sin(tm*e.sp+e.ph);g.fillStyle='rgba(255,90,90,.28)';g.beginPath();g.arc(x,y,e.r,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(x,y,8,0,7);g.fill();g.fillStyle='#000';g.fillRect(x-2+Math.cos(tm*e.sp+e.ph)*3|0,y-2,4,4)}
  else{const o=(tm*.9+e.ph)%2<1.1;if(o){g.fillStyle='rgba(255,90,255,.28)';g.beginPath();g.arc(e.x,y,e.r,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(e.x,y,8,0,7);g.fill();g.fillStyle='#000';g.fillRect(e.x-2,y-2,4,4)}else{g.fillStyle='#fff';g.fillRect(e.x-8,y-1,16,3)}}}
 g.globalAlpha=1;
 for(const s of stars)if(!s.got){const y=SY(s.y);g.fillStyle='#ffe45e';g.fillRect(s.x-1,y-5,3,11);g.fillRect(s.x-5,y-1,11,3);g.fillRect(s.x-3,y-3,7,7)}
 let px=planet.x,py=SY(planet.y),pr=planet.r;
 if(st=='abduct'||st=='next'){const k=Math.min(1,ab/1.1);const sx=ship.x,sy=H-100;if(st=='abduct'){g.fillStyle='rgba(160,255,200,.35)';g.beginPath();g.moveTo(sx-10,sy-14);g.lineTo(sx+10,sy-14);g.lineTo(px+pr,py);g.lineTo(px-pr,py);g.fill();px+=(sx-px)*k;py+=(sy-8-py)*k;pr*=1-k}else pr=0}
 if(pr>1)pl(px,py,pr);
 if(SV.lvl==51&&st=='play')txt('ÁREA 51',planet.x,py-pr-8,'#9f9',12,'center');
 const sy=H-100+Math.sin(t*4)*2;g.save();g.translate(ship.x|0,sy|0);g.rotate(ship.vx/105*.25);
 if(st=='seen')g.translate(Math.sin(t*60)*2,0);g.drawImage(sp,-sp.width/2|0,-sp.height/2|0);g.restore();
 if(st=='seen'){g.drawImage(DI,ship.x-DI.width/2+14|0,sy-sp.height/2-DI.height-2+Math.sin(t*20)*2|0);txt('VISTO!',ship.x,sy-sp.height/2-34,'#f55',16,'center')}
 if(al>0&&st=='play'){g.fillStyle='rgba(160,255,200,.3)';g.fillRect(ship.x-6,py+pr,12,H-100-py-pr-20)}
 txt('PLANETA '+SV.lvl+'/51',8,16,'#fff',12);
 if(SV.lvl<=4&&(st=='play'||st=='seen'))TT[SV.lvl].split('\n').forEach((l,i)=>txt(l,W/2,46+i*14,'#ffe45e',11,'center'));txt('★ '+(SV.coins+run),W-46,16,'#ffe45e',12,'right');
 if(st=='play'&&tm<6&&SV.lvl==1){txt('◀ TOQUE ▶',W/2,H-30,'#fff',14,'center')}
 if(st=='next')txt('PLANETA ABDUZIDO! +3★',W/2,H/2,'#9f9',14,'center')}
function frame(n){requestAnimationFrame(frame);const dt=Math.min((n-(frame.l||n))/1000,.05);frame.l=n;if(!rdy)return;update(dt);draw()}
requestAnimationFrame(frame);
// controles
const P={};function sd(){let l=kk.ArrowLeft||kk.KeyA?1:0,r=kk.ArrowRight||kk.KeyD?1:0;for(const k in P)P[k]<innerWidth/2?l=1:r=1;dir=(r-l)*(SV.inv?-1:1)}
addEventListener('pointerdown',e=>{if(e.target.closest('button,.ov'))return;P[e.pointerId]=e.clientX;sd()});
addEventListener('pointermove',e=>{if(e.pointerId in P){P[e.pointerId]=e.clientX;sd()}});
for(const n of['pointerup','pointercancel'])addEventListener(n,e=>{delete P[e.pointerId];sd()});
addEventListener('keydown',e=>{kk[e.code]=1;sd()});addEventListener('keyup',e=>{kk[e.code]=0;sd()});
// menus
const tg=()=>$('bi').textContent='CONTROLES: '+(SV.inv?'INVERTIDOS':'NORMAIS');tg();
$('bi').onclick=()=>{SV.inv^=1;save();tg()};
$('bp').onclick=()=>{$('menu').hidden=1;$('pa').style.display='block';build(SV.lvl)};
$('pa').onclick=()=>{st='menu';$('menu').hidden=0;$('pa').style.display='none'};
$('bw').onclick=()=>{$('win').hidden=1;$('menu').hidden=0;st='menu'};
function grid(){$('co').textContent=SV.coins;const G=$('grid');G.innerHTML='';COL.forEach((c,i)=>{const b=document.createElement('button'),own=SV.own.includes(i);b.style.background=`rgb(${c})`;b.className=SV.sel==i?'sel':'';b.textContent=own?'':'🔒'+i*3;
 b.onclick=()=>{if(!own){if(SV.coins<i*3){$('cm').textContent='Faltam '+(i*3-SV.coins)+' ★. Abduza planetas para ganhar ★!';return}SV.coins-=i*3;SV.own.push(i)}SV.sel=i;save();tint();grid();$('cm').textContent='Cor equipada!'};G.appendChild(b)})}
$('bc').onclick=()=>{$('menu').hidden=1;$('cols').hidden=0;grid()};
$('bb').onclick=()=>{$('cols').hidden=1;$('menu').hidden=0};
</script></body></html>
